<!doctype html>
<head>
    <title>Hasil Tes Anda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Hasil Tes Anda</h1>

        <p>Kategori minat tertinggi Anda adalah: <strong>{{ kategori_tertinggi }}</strong></p>

        <h2>Deskripsi Tipe Kepribadian Anda</h2>
        <p>{{ deskripsi }}</p>

        <h2>Rekomendasi Karir</h2>
        <ul>
            {% for karir in rekomendasi %}
            <li>{{ karir }}</li>
            {% endfor %}
        </ul>

        <a href="/" class="button">Ulangi Tes</a>
    </div>
</body>
</html>
